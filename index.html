body{font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.ctrls{padding:8px 20px;background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);display:flex;gap:7px;align-items:center;flex-wrap:wrap}

.srch input{width:100%;padding:8px 8px 8px 28px;border:0.5px solid var(--color-border-secondary);border-radius:8px;font-size:14px;font-family:inherit;background:var(--color-background-primary);color:var(--color-text-primary);outline:none;-webkit-appearance:none}

.t td{padding:10px 8px;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px;color:var(--color-text-primary);vertical-align:middle;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}

.bwt{background:#FFFBEB;color:#92400E;border-color:#FDE68A}

.mob-bar-s{font-size:11px;color:var(--color-text-tertiary);margin-top:1px}

.rp{display:flex;flex-direction:column;background:var(--color-background-primary)}

.emp-ic{font-size:32px;color:var(--color-text-tertiary);opacity:.4}

.emp-s{font-size:12px;color:var(--color-text-tertiary);line-height:1.6;max-width:200px}

.ed{display:flex;flex-direction:column;min-height:460px}
.mob-back-btn{display:none;align-items:center;gap:6px;padding:0;border:none;background:transparent;font-size:13px;font-family:inherit;color:var(--color-text-secondary);cursor:pointer;margin-bottom:10px}

const NT={vantaa:`Paljonko maksaa kolmion muutto Vantaalla? Tänään asiakas halusi muuttaa kolmiosta lyhyen matkan Vantaan sisällä, johon Jätkät totesivat vaan: "enemmän kantamista, vähemmän ajamista, jes!" Lähtöosoitteessa tavarat vedettiin pitkän käytävän läpi rappusille ja siitä vielä rappusia pitkin autolle. Tähän keikkaan laskettiin kotisivuillamme sopivaksi tällainen pulla-auto, johon menee yleensä kaksion–kolmion tavarat. Kaikki lastattiin tiiviisti ja herkimmät tavarat suojattiin, jotta tavarat kulkee ehjänä perille sinne uuteen kotiin asti!\nViimeisenä kyytiin nostettiin vielä grilli ja sitten ajettiin uudelle kodille Koivukylään. Täällä päässä auto saatiin suoraan oven eteen ja kamat tyhjeni nopeammin kuin Jätkien kahvimukit aamulla.\nKassalle ei myöskään jätetty mitään pommeja ja nyt kuullaan etukäteen laskettu hinta:\n🟠 Kaksion muutto\n🟠 2 jätkää + Pulla-autollinen tavaraa (20m³)\n🟠 10km muuttoväli\n🟠 Herkimpien tavaroiden suojaus\n367€\nSelvitä oman muuton tai kuljetuksen tarkka hinta 3 minuutissa👀\nwww.pomminvarmatjatkat.fi`,uusimaa:`Paljonko maksaa kaksion muutto Espoonlahdesta Soukkaan? Tänään Jätkät hälytettiin muuttoon.\nPerillä vastassa oli klassikko: kaikki tavarat 3. kerroksessa, ei hissiä, mutta sehän kelpaa Jätkille pomminvarmasti💥\nAlhaalta varattiin autolle paikka, tiivis pakkaus, jotta kaikki selviää ehjänä myös tämän lyhyen matkan.\nJa nyt kuullaan hinta:\n🟠 Kaksion muutto Espoonlahti → Soukka\n🟠 2 jätkää + iso pakettiauto (12m³)\n🟠 10 km muuttoväli\n🟠 3. kerros (ei hissiä)\n313€\nSelvitä omasi hinta 3 minuutissa👀\nwww.pomminvarmatjatkat.fi`,turku:`Paljonko maksaa kaksion muutto Turussa? 👀\nTällä kertaa päivä alkoi Turusta, missä Jätkät muuttivat kaksion suurimmat kalusteet vain 300 metrin päähän.\nEli käytännössä naapuriin mutta pesukone ei silti kävele sinne itse, vaan Jätkien reppuselässä tietysti😁\nEnsimmäisenä käsittelyyn pääsi 85-tuumainen telkkari, jolle tehtiin pomminvarma suojaus ennen kyytiin nostoa.\nAsiakas oli listannut tavarat etukäteen kotisivuilla ja saanut tarkan hinnan muutamassa minuutissa.\nJa tämän muuttopalvelun hinta:\n🟠 2 Pomminvarmaa Jätkää\n🟠 Pakettiautollinen tavaraa (12m³)\n🟠 300m muuttoväli\n🟠 Herkimpien tavaroiden suojaus\n🟠 Tavarat suoraan oikeille paikoille\n182€\nSelvitä oman muuttosi hinta muutamassa minuutissa:\nwww.pomminvarmatjatkat.fi`,helsinki:`Paljonko maksaa kaksion muutto Helsingin keskustassa? 👀\nTällä kertaa asiakas muutti kaikki tavarat Kallion sisällä. Tällä keikalla osa tavaroista oli vanhoja ihan niinkuin rakennuksetkin ja täten myös normaalia painavempia, mutta sehän kelpaa Jätkille pomminvarmasti 💥\nJätkät kantoi alkuun isoimmat huonekalut 2. kerroksesta autolle ja teki autoon pomminvarman pakkauksen. Tavaratila täyttyi nopeammin kuin Jätkien kahvimukit aamulla, ja puolet tavaroista oli vielä asunnossa… "Mitäs nyt?"\nNo tämä oli tiedossa etukäteen, koska muuttomatka oli niin lyhyt, että laskimme järkeväksi hoitaa kahdella kierroksella.\nJa nyt kuullaan hinta:\n🟠 2 Pomminvarmaa Jätkää\n🟠 2 pakettiautollista tavaraa (22m³)\n🟠 2km muuttoväli\n🟠 Kanto 2. kerroksesta pakulle\n🟠 Kanto pakulta 4. kerrokseen\n414€\nSelvitä oman muuton hinta muutamassa minuutissa:\nwww.pomminvarmatjatkat.fi`,espoo:`Paljonko maksaa kolmion muutto Espoossa? 👀\nTällä kertaa asiakas muutti kolmion tavarat Espoossa, johon Jätkät vastasi tietysti: "hoituu" ja "milloin?" Lähtöosoite oli 8. kerroksessa ja kohdeosoite kakkosessa.\nEnsimmäinen kuorma saatiinkin kokonaan hissillä, kamat kyytiin, pomminvarma kuormasidonta ja nokka kohti Espoonlahtea.\nPerillä Jätkät tyhjensi kamat suoraan asiakkaan osoittamille paikoille.\nJa tämän muuttopalvelun hinta:\n🟠 2 Pomminvarmaa Jätkää\n🟠 2 pakettiautollista tavaraa (24m³)\n🟠 3+3=6km muuttoväli\n🟠 Herkimpien tavaroiden suojaus\n392€\nSelvitä oman hinta muutamassa minuutissa:\nwww.pomminvarmatjatkat.fi`,kirkkonummi:`Paljon maksaa muutto Kirkkonummella? 👀\nTällä kertaa asiakas löysi Jätkät somesta ja halusi muuttaa kolmion tavarat paritaloon pomminvarmasti 💥\nLähtöpaikassa muuttolaatikoita oli ihan jäätävä määrä, ja Jätkät järjesti ne pakun perälle nätisti.\nPerillä tavarat kannettiin upeaan paritaloon asiakkaan osoittamille paikoille.\nJa tämän muuttopalvelun hinta oli:\n🟠 2 Pomminvarmaa Jätkää\n🟠 Iso pakettiautollinen tavaraa (16m³)\n🟠 Kolmion muutto paritaloon\n🟠 4 km muuttoväli\n286€\nSelvitä muuton tai kuljetuksen hinta 3 minuutissa:\nwww.pomminvarmatjatkat.fi`,porvoo:`Paljonko maksaa ison kolmion muutto Porvoossa? 👀\nTänään Jätkät oli Porvoossa, missä piti muuttaa kolmion tavarat 3. kerroksesta ilman hissiä. Puolet kamoista varastoon ja puolet uuteen kotiin — ja sehän kelpaa Jätkille pomminvarmasti 💥\nVaikka tässä keikassa oli kaksi eri kohdeosoitetta, asiakas sai silti sentin tarkan hinnan etukäteen.\nNyt kuullaan tämän muuttopalvelun etukäteen laskettu hinta:\n🟠 3 Pomminvarmaa Jätkää\n🟠 2 pulla-autollista tavaraa\n🟠 3. kerros ilman hissiä\n🟠 2 kohdeosoitetta\n🟠 3km molempiin kohteisiin\n1020€\nSelvitä oman muuttosi hinta muutamassa minuutissa:\nwww.pomminvarmatjatkat.fi`,itahelsinki:`Paljonko maksaa Itä-Helsingin edullisin kaksion muutto? 👀\nTällä kertaa Jätkät oli Vuosaaressa muuttamassa pelkät huonekalut ja pihakalusteet viereiseen rakennukseen — muuttoväliä noin 500 metriä. "Kelpaa!" 💥\nPatjat ja sängyt lastattiin pomminvarmaan pakuun. Kun kamat oli kasassa, tuli pieni yllätys… Asiakkaan auto ei käynnistynyt. Jätkät heitti asiakkaalle pomminvarman "VIP-kyydin" uuteen osoitteeseen.\nJa tämän muuttopalvelun hinta oli:\n🟠 2 Pomminvarmaa Jätkää\n🟠 Pakettiautollinen tavaraa (12m³)\n🟠 500 m muuttoväli\n🟠 Hissit molemmissa kohteissa\n205€\nSelvitä oman muuttosi hinta muutamassa minuutissa:\nwww.pomminvarmatjatkat.fi`};
const NL={vantaa:"Vantaa",uusimaa:"Uusimaa",turku:"Turku",helsinki:"Helsinki",espoo:"Espoo",kirkkonummi:"Kirkkonummi",porvoo:"Porvoo",itahelsinki:"Itä-Helsinki"};
const RM={Vantaa:"vantaa",Helsinki:"helsinki",Espoo:"espoo",Turku:"turku",Kaarina:"turku",Kirkkonummi:"kirkkonummi",Porvoo:"porvoo",Pääkaupunkiseutu:"uusimaa",Kerava:"uusimaa",Tuusula:"uusimaa",Sipoo:"uusimaa",Karkkila:"uusimaa",Askola:"uusimaa",Kellokoski:"uusimaa",Järvenpää:"uusimaa",Hyvinkää:"uusimaa",Mäntsälä:"uusimaa",Myrskylä:"uusimaa",Jokela:"uusimaa",Kauniainen:"espoo"};

let statuses={},selected=new Set(),customTexts={},searchQ='',filterReg='',filterSt='',filteredGroups=[],activePanelKey=null;

const rSel=document.getElementById('filter-region');
[...new Set(GROUPS.map(g=>g.region))].sort().forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;rSel.appendChild(o);});

function isMob(){return window.innerWidth<580;}
function splitEl(){return document.getElementById('split');}

function openMobEditor(){
  const s=splitEl();s.classList.remove('mob-list');s.classList.add('mob-editor');
  renderRight();
  document.getElementById('right-panel').scrollIntoView({behavior:'smooth',block:'start'});
}
function closeMobEditor(){
  const s=splitEl();s.classList.remove('mob-editor');s.classList.add('mob-list');
}

async function loadStorage(){
  try{const r=await window.storage.get('fb_group_statuses');if(r&&r.value)statuses=JSON.parse(r.value);else GROUPS.forEach(g=>{statuses[g.id]=g.def;});}
  catch(e){GROUPS.forEach(g=>{statuses[g.id]=g.def;});}
  try{const ct=await window.storage.get('fb_custom_texts');if(ct&&ct.value)customTexts=JSON.parse(ct.value);}catch(e){}
  render();
}
async function saveSt(){try{await window.storage.set('fb_group_statuses',JSON.stringify(statuses));}catch(e){}}
async function saveCT(){try{await window.storage.set('fb_custom_texts',JSON.stringify(customTexts));}catch(e){}}
function getTxt(k){return customTexts[k]!==undefined?customTexts[k]:(NT[k]||'');}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function flash(id){const el=document.getElementById(id);if(!el)return;el.style.display='inline-flex';setTimeout(()=>el.style.display='none',2000);}

function toggleSt(id){statuses[id]=statuses[id]==='JULKAISTU'?'ODOTTAA':'JULKAISTU';saveSt();render();}
function toggleSel(id){if(selected.has(id))selected.delete(id);else selected.add(id);render();}

function getSelKeys(){
  const selG=GROUPS.filter(g=>selected.has(g.id));
  const kf={};
  selG.forEach(g=>{const k=RM[g.region];if(k)kf[k]=(kf[k]||0)+1;});
  return {kf,keys:Object.keys(kf).sort((a,b)=>kf[b]-kf[a]),noTxt:selG.filter(g=>!RM[g.region]).length};
}

function updateMobBar(){
  const bar=document.getElementById('mob-bar');
  if(!bar)return;
  if(selected.size===0){bar.style.display='none';return;}
  bar.style.display='flex';
  document.getElementById('mob-bar-l').textContent=selected.size+' ryhmää valittu';
  const {keys}=getSelKeys();
  document.getElementById('mob-bar-s').textContent=keys.map(k=>NL[k]).join(', ')||'Ei tekstiä';
  const btn=document.getElementById('mob-open-ed');
  if(btn)btn.onclick=()=>openMobEditor();
}

function render(){
  const pub=Object.values(statuses).filter(s=>s==='JULKAISTU').length;
  document.getElementById('cnt-pub').textContent=pub;
  document.getElementById('cnt-wait').textContent=Object.values(statuses).filter(s=>s==='ODOTTAA').length;
  const pct=Math.round(pub/154*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct+'%';
  filteredGroups=GROUPS.filter(g=>{
    const s=statuses[g.id]||g.def;
    return(!searchQ||g.name.toLowerCase().includes(searchQ.toLowerCase())||g.region.toLowerCase().includes(searchQ.toLowerCase()))
      &&(!filterReg||g.region===filterReg)&&(!filterSt||s===filterSt);
  });
  document.getElementById('row-count').textContent=filteredGroups.length+' näkyvissä';
  renderRows();
  updateMobBar();
  if(!isMob()||splitEl().classList.contains('mob-editor'))renderRight();
}

function renderRows(){
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  filteredGroups.forEach(g=>{
    const s=statuses[g.id]||g.def;
    const isSel=selected.has(g.id);
    const tr=document.createElement('tr');
    if(isSel)tr.className='sr';
    tr.innerHTML=`<td class="cn" style="text-align:center"><input type="checkbox" data-cb="${g.id}" ${isSel?'checked':''}></td><td class="cn2">${g.id}</td><td class="cna" title="${g.name}">${g.name}</td><td class="crg"><span class="rtag">${g.region}</span></td><td class="cst"><span class="bdg ${s==='JULKAISTU'?'bok':'bwt'}" data-bid="${g.id}">${s==='JULKAISTU'?'✓ Julkaistu':'Odottaa'}</span></td>`;
    tr.addEventListener('click',e=>{if(e.target.closest('.bdg')||e.target.type==='checkbox')return;toggleSel(g.id);});
    tbody.appendChild(tr);
  });
  document.querySelectorAll('.bdg[data-bid]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();toggleSt(parseInt(b.dataset.bid));}));
  document.querySelectorAll('input[data-cb]').forEach(cb=>cb.addEventListener('change',()=>{const id=parseInt(cb.dataset.cb);if(cb.checked)selected.add(id);else selected.delete(id);render();}));
  const allSel=filteredGroups.length>0&&filteredGroups.every(g=>selected.has(g.id));
  const someSel=filteredGroups.some(g=>selected.has(g.id));
  const cbAll=document.getElementById('cb-all');
  cbAll.checked=allSel;cbAll.indeterminate=!allSel&&someSel;
}

function renderRight(){
  const panel=document.getElementById('right-panel');
  if(selected.size===0){
    panel.innerHTML=`<div class="emp"><div class="emp-ic"><i class="ti ti-notes" aria-hidden="true"></i></div><div class="emp-t">Valitse ryhmiä</div><div class="emp-s">Klikkaa rivejä tai valitse kaikki ylälaidan valintaruudusta</div></div>`;
    return;
  }
  const{kf,keys,noTxt}=getSelKeys();
  if(!activePanelKey||!keys.includes(activePanelKey))activePanelKey=keys[0]||null;
  const isMod=activePanelKey&&customTexts[activePanelKey]!==undefined;
  const curTxt=activePanelKey?getTxt(activePanelKey):'';
  const mob=isMob();

  const backBtn=mob?`<button class="mob-back-btn" id="btn-back"><i class="ti ti-arrow-left" style="font-size:14px" aria-hidden="true"></i>Takaisin listaan</button>`:'';
  const tabsHtml=keys.length>1?`<div class="ed-tabs">${keys.map(k=>`<button class="etab${k===activePanelKey?' act':''}" data-tab="${k}">${NL[k]}<span class="etab-ct">${kf[k]}</span></button>`).join('')}</div>`:'';
  const noTxtNote=noTxt>0?`<div style="font-size:11px;color:var(--color-text-tertiary);margin-top:6px">${noTxt} ryhmällä ei ole Notion-tekstiä</div>`:'';

  if(!activePanelKey){
    panel.innerHTML=`<div class="ed"><div class="ed-top">${backBtn}<div class="ed-cnt">${selected.size} ryhmää valittu</div><div class="ed-sub">Ei tekstiä näille alueille</div>${noTxtNote}</div><div class="ed-body" style="flex:1;display:flex;align-items:center;justify-content:center"><div style="text-align:center;color:var(--color-text-secondary);font-size:13px">Näille alueille ei löydy tekstiä</div></div><div class="ed-ft"><button class="btn btn-gh" id="btn-clr"><i class="ti ti-x" style="font-size:12px"></i>Tyhjennä valinta</button></div></div>`;
    if(mob)document.getElementById('btn-back')?.addEventListener('click',closeMobEditor);
    document.getElementById('btn-clr').addEventListener('click',()=>{selected.clear();activePanelKey=null;if(mob)closeMobEditor();render();});
    return;
  }

  panel.innerHTML=`<div class="ed"><div class="ed-top">${backBtn}<div class="ed-cnt">${selected.size} ryhmää valittu</div><div class="ed-sub">${keys.length===1?NL[keys[0]]+' — '+kf[keys[0]]+' ryhmää':'Valitse alue alta'}</div>${tabsHtml}${noTxtNote}</div><div class="ed-body"><textarea class="ed-ta" id="notion-ta" spellcheck="false">${esc(curTxt)}</textarea></div><div class="ed-ft"><button class="btn btn-pr" id="btn-cp" style="flex:1;justify-content:center"><i class="ti ti-copy" style="font-size:13px"></i>Kopioi teksti</button><button class="btn" id="btn-sv"><i class="ti ti-device-floppy" style="font-size:13px"></i>${isMod?'<span class="mod-dot"></span>':''}Tallenna</button><button class="btn btn-gh" id="btn-rst"><i class="ti ti-rotate" style="font-size:12px"></i></button><span class="fl" id="fl-cp"><i class="ti ti-check" style="font-size:11px"></i>Kopioitu</span><span class="fl" id="fl-sv"><i class="ti ti-check" style="font-size:11px"></i>Tallennettu</span><span class="cc" id="cc">${curTxt.length}</span></div></div>`;

  if(mob)document.getElementById('btn-back')?.addEventListener('click',closeMobEditor);
  document.querySelectorAll('.etab[data-tab]').forEach(tab=>tab.addEventListener('click',()=>{activePanelKey=tab.dataset.tab;renderRight();}));
  const ta=document.getElementById('notion-ta');
  ta.addEventListener('input',()=>{document.getElementById('cc').textContent=ta.value.length;});
  document.getElementById('btn-cp').addEventListener('click',()=>{navigator.clipboard.writeText(ta.value).then(()=>flash('fl-cp'));});
  document.getElementById('btn-sv').addEventListener('click',async()=>{customTexts[activePanelKey]=ta.value;await saveCT();flash('fl-sv');setTimeout(()=>renderRight(),2100);});
  document.getElementById('btn-rst').addEventListener('click',()=>{if(!confirm('Palautetaanko alkuperäinen teksti?'))return;delete customTexts[activePanelKey];saveCT();renderRight();});
}

document.getElementById('cb-all').addEventListener('change',function(){
  if(this.checked)filteredGroups.forEach(g=>selected.add(g.id));
  else filteredGroups.forEach(g=>selected.delete(g.id));
  render();
});
document.getElementById('search').addEventListener('input',e=>{searchQ=e.target.value;render();});
document.getElementById('filter-region').addEventListener('change',e=>{filterReg=e.target.value;render();});
document.getElementById('filter-status').addEventListener('change',e=>{filterSt=e.target.value;render();});
document.getElementById('btn-reset').addEventListener('click',()=>{
  if(!confirm('Nollataan kaikkien 154 ryhmän tilat → Odottaa?'))return;
  GROUPS.forEach(g=>{statuses[g.id]='ODOTTAA';});saveSt();render();
});
window.addEventListener('resize',()=>{
  const s=splitEl();
  if(!isMob()){s.classList.remove('mob-list','mob-editor');}
  else if(!s.classList.contains('mob-editor'))s.classList.add('mob-list');
  render();
});
loadStorage();
</script>
