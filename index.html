.stat-label{font-size:11px;color:var(--color-text-secondary)}

.controls input[type=text],.controls select{font-size:13px;padding:6px 10px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);height:34px}

.btn:hover{background:var(--color-background-secondary)}
.btn-primary{background:var(--color-background-success);color:var(--color-text-success);border-color:var(--color-border-success)}
.btn-primary:hover{opacity:.85}
.btn-danger{border-color:#E24B4A;color:#A32D2D}.btn-danger:hover{background:#FCEBEB}
.tbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.tbl th{background:var(--color-background-secondary);padding:7px 8px;text-align:left;font-weight:500;font-size:11px;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-secondary);position:sticky;top:0;z-index:1}
.tbl td{padding:6px 8px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr.is-selected td{background:var(--color-background-info)}
.tbl tr:not(.is-selected):hover td{background:var(--color-background-secondary)}
.col-cb{width:30px}.col-num{width:30px}.col-name{width:auto}.col-region{width:100px}.col-status{width:100px}.col-act{width:36px}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;user-select:none}
.badge:hover{opacity:.8}
.badge-ok{background:#EAF3DE;color:#3B6D11;border:0.5px solid #97C459}
.badge-wait{background:#FAEEDA;color:#854F0B;border:0.5px solid #EF9F27}
.region-tag{font-size:11px;color:var(--color-text-secondary);background:var(--color-background-secondary);padding:2px 7px;border-radius:20px}

.progress-bar{height:5px;background:var(--color-background-secondary);border-radius:3px;margin-bottom:14px;overflow:hidden}
.progress-fill{height:100%;background:#639922;border-radius:3px;transition:width .4s}
.reset-note{font-size:11px;color:var(--color-text-secondary);margin-left:auto}
.sel-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--color-background-info);border:0.5px solid var(--color-border-info);border-radius:var(--border-radius-md);margin-top:8px;flex-wrap:wrap}
.sel-count{font-size:13px;font-weight:500;color:var(--color-text-info)}
.sel-tags{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.sel-tag{font-size:11px;background:var(--color-background-primary);color:var(--color-text-info);padding:2px 8px;border-radius:20px;border:0.5px solid var(--color-border-info)}

.region-no-text{font-size:12px;color:var(--color-text-secondary);font-style:italic}

const NOTION_LABELS={vantaa:"Vantaa",uusimaa:"Uusimaa (yleinen)",turku:"Turku & Kaarina",helsinki:"Helsinki",espoo:"Espoo & Kauniainen",kirkkonummi:"Kirkkonummi",porvoo:"Porvoo",itahelsinki:"Itä-Helsinki"};

const REGION_MAP={
Vantaa:"vantaa",Helsinki:"helsinki",Espoo:"espoo",Turku:"turku",Kaarina:"turku",
Kirkkonummi:"kirkkonummi",Porvoo:"porvoo",Pääkaupunkiseutu:"uusimaa",
Kerava:"uusimaa",Tuusula:"uusimaa",Sipoo:"uusimaa",Karkkila:"uusimaa",
Askola:"uusimaa",Kellokoski:"uusimaa",Järvenpää:"uusimaa",Hyvinkää:"uusimaa",
Mäntsälä:"uusimaa",Myrskylä:"uusimaa",Jokela:"uusimaa",Kauniainen:"espoo"
};

let statuses={};
let selected=new Set();
let searchQ="",filterReg="",filterSt="";
let filteredGroups=[];
let customTexts={};
let activePanelKey=null;

const regions=[...new Set(GROUPS.map(g=>g.region))].sort();
const selReg=document.getElementById("filter-region");
regions.forEach(r=>{const o=document.createElement("option");o.value=r;o.textContent=r;selReg.appendChild(o);});

async function loadStorage(){
  try{
    const r=await window.storage.get("fb_group_statuses");
    if(r&&r.value) statuses=JSON.parse(r.value);
    else GROUPS.forEach(g=>{statuses[g.id]=g.def;});
  }catch(e){GROUPS.forEach(g=>{statuses[g.id]=g.def;});}
  try{
    const ct=await window.storage.get("fb_custom_texts");
    if(ct&&ct.value) customTexts=JSON.parse(ct.value);
  }catch(e){}
  render();
}

async function saveStatuses(){
  try{await window.storage.set("fb_group_statuses",JSON.stringify(statuses));}catch(e){}
}

async function saveCustomTexts(){
  try{await window.storage.set("fb_custom_texts",JSON.stringify(customTexts));}catch(e){}
}

function getTextForKey(key){
  return customTexts[key]!==undefined ? customTexts[key] : (NOTION_TEXTS[key]||"");
}

function toggle(id){
  statuses[id]=statuses[id]==="JULKAISTU"?"ODOTTAA":"JULKAISTU";
  saveStatuses();render();
}

function toggleSelect(id){
  if(selected.has(id)) selected.delete(id);
  else selected.add(id);
  renderSelBar();
  renderTableRows();
}

function renderSelBar(){
  const bar=document.getElementById("sel-bar");
  if(selected.size===0){bar.style.display="none";return;}
  bar.style.display="flex";
  document.getElementById("sel-count").textContent=selected.size+" ryhmää valittu";
  const selGroups=GROUPS.filter(g=>selected.has(g.id));
  const uniqueKeys=[...new Set(selGroups.map(g=>REGION_MAP[g.region]).filter(Boolean))];
  const tagsEl=document.getElementById("sel-tags");
  tagsEl.innerHTML="";
  uniqueKeys.forEach(k=>{
    const sp=document.createElement("span");
    sp.className="sel-tag";
    sp.textContent=NOTATION_LABELS_LOCAL(k);
    tagsEl.appendChild(sp);
  });
}

function NOTATION_LABELS_LOCAL(k){return NOTION_LABELS[k]||k;}

function openTextPanel(){
  const selGroups=GROUPS.filter(g=>selected.has(g.id));
  const keyFreq={};
  selGroups.forEach(g=>{const k=REGION_MAP[g.region];if(k){keyFreq[k]=(keyFreq[k]||0)+1;}});
  const uniqueKeys=Object.keys(keyFreq).sort((a,b)=>keyFreq[b]-keyFreq[a]);

  const panel=document.getElementById("notion-panel");
  const selLabel=document.getElementById("panel-sel-label");
  const textSel=document.getElementById("panel-text-select");
  
  panel.style.display="block";
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});

  if(uniqueKeys.length===0){
    selLabel.textContent="Ei vastaavaa Notion-tekstiä";
    textSel.style.display="none";
    document.getElementById("notion-textarea").value="Tälle alueelle ei löydy vastaavaa tekstiä Notionista. Kirjoita teksti alle:";
    activePanelKey=null;
  } else if(uniqueKeys.length===1){
    activePanelKey=uniqueKeys[0];
    selLabel.textContent=NOTION_LABELS[activePanelKey];
    textSel.style.display="none";
    loadTextToPanel(activePanelKey);
  } else {
    activePanelKey=uniqueKeys[0];
    selLabel.textContent="Useita alueita — valitse teksti:";
    textSel.style.display="block";
    textSel.innerHTML="";
    uniqueKeys.forEach(k=>{
      const o=document.createElement("option");
      o.value=k;
      o.textContent=NOTION_LABELS[k]+" ("+keyFreq[k]+" ryhmää)";
      textSel.appendChild(o);
    });
    loadTextToPanel(activePanelKey);
    textSel.onchange=()=>{activePanelKey=textSel.value;loadTextToPanel(activePanelKey);};
  }
}

function loadTextToPanel(key){
  const ta=document.getElementById("notion-textarea");
  ta.value=getTextForKey(key);
  updateCharCount();
}

function updateCharCount(){
  const ta=document.getElementById("notion-textarea");
  document.getElementById("char-count").textContent=ta.value.length+" merkkiä";
}

function render(){
  const pub=Object.values(statuses).filter(s=>s==="JULKAISTU").length;
  const wait=Object.values(statuses).filter(s=>s==="ODOTTAA").length;
  document.getElementById("cnt-pub").textContent=pub;
  document.getElementById("cnt-wait").textContent=wait;
  document.getElementById("prog-fill").style.width=Math.round(pub/154*100)+"%";
  filteredGroups=GROUPS.filter(g=>{
    const s=statuses[g.id]||g.def;
    const matchQ=!searchQ||g.name.toLowerCase().includes(searchQ.toLowerCase())||g.region.toLowerCase().includes(searchQ.toLowerCase());
    const matchR=!filterReg||g.region===filterReg;
    const matchS=!filterSt||s===filterSt;
    return matchQ&&matchR&&matchS;
  });
  document.getElementById("row-count").textContent=filteredGroups.length+" näkyvissä";
  renderTableRows();
  renderSelBar();
}

function renderTableRows(){
  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";
  filteredGroups.forEach(g=>{
    const s=statuses[g.id]||g.def;
    const isSel=selected.has(g.id);
    const hasText=!!REGION_MAP[g.region];
    const tr=document.createElement("tr");
    if(isSel) tr.className="is-selected";
    tr.innerHTML=`
      <td class="col-cb cb-wrap"><input type="checkbox" data-cb="${g.id}" ${isSel?"checked":""}></td>
      <td class="col-num" style="font-size:11px;color:var(--color-text-tertiary)">${g.id}</td>
      <td class="col-name" style="color:var(--color-text-primary);font-size:13px">${g.name}</td>
      <td class="col-region"><span class="region-tag">${g.region}</span></td>
      <td class="col-status"><span class="badge ${s==="JULKAISTU"?"badge-ok":"badge-wait"}" data-id="${g.id}">${s==="JULKAISTU"?"✓ Julkaistu":"Odottaa"}</span></td>
      <td class="col-act" style="text-align:center"><button class="icon-btn${hasText?"":" disabled-icon"}" data-notion-id="${g.id}" aria-label="Valitse ja avaa teksti" title="${hasText?"Avaa teksti":"Ei Notion-tekstiä"}" style="${hasText?"":"opacity:.35;cursor:default"}"><i class="ti ti-notes" aria-hidden="true"></i></button></td>`;
    tbody.appendChild(tr);
  });
  document.querySelectorAll(".badge[data-id]").forEach(b=>{
    b.addEventListener("click",e=>{e.stopPropagation();toggle(parseInt(b.dataset.id));});
  });
  document.querySelectorAll("input[data-cb]").forEach(cb=>{
    cb.addEventListener("change",()=>toggleSelect(parseInt(cb.dataset.cb)));
  });
  document.querySelectorAll(".icon-btn[data-notion-id]").forEach(b=>{
    if(b.style.opacity==="0.35") return;
    b.addEventListener("click",()=>{
      const id=parseInt(b.dataset.notionId);
      if(!selected.has(id)){selected.add(id);renderSelBar();renderTableRows();}
      openTextPanel();
    });
  });
  const allVisible=filteredGroups.length>0&&filteredGroups.every(g=>selected.has(g.id));
  document.getElementById("cb-all").checked=allVisible;
  document.getElementById("cb-all").indeterminate=!allVisible&&filteredGroups.some(g=>selected.has(g.id));
}

document.getElementById("cb-all").addEventListener("change",function(){
  if(this.checked) filteredGroups.forEach(g=>selected.add(g.id));
  else filteredGroups.forEach(g=>selected.delete(g.id));
  renderSelBar();renderTableRows();
});

document.getElementById("btn-open-text").addEventListener("click",openTextPanel);

document.getElementById("btn-clear-sel").addEventListener("click",()=>{
  selected.clear();
  document.getElementById("notion-panel").style.display="none";
  renderSelBar();renderTableRows();
});

document.getElementById("panel-close").addEventListener("click",()=>{
  document.getElementById("notion-panel").style.display="none";
});

document.getElementById("notion-textarea").addEventListener("input",updateCharCount);

document.getElementById("btn-copy-text").addEventListener("click",()=>{
  const t=document.getElementById("notion-textarea").value;
  navigator.clipboard.writeText(t).then(()=>{
    const ok=document.getElementById("copy-ok");
    ok.style.display="inline-flex";
    setTimeout(()=>{ok.style.display="none";},2000);
  });
});

document.getElementById("btn-save-text").addEventListener("click",async()=>{
  if(!activePanelKey) return;
  customTexts[activePanelKey]=document.getElementById("notion-textarea").value;
  await saveCustomTexts();
  const ok=document.getElementById("saved-ok");
  ok.style.display="inline-flex";
  setTimeout(()=>{ok.style.display="none";},2000);
});

document.getElementById("btn-restore").addEventListener("click",()=>{
  if(!activePanelKey) return;
  if(!confirm("Palautetaanko Notionin alkuperäinen teksti? Tallennetut muutokset poistetaan.")) return;
  delete customTexts[activePanelKey];
  saveCustomTexts();
  loadTextToPanel(activePanelKey);
});

document.getElementById("search").addEventListener("input",e=>{searchQ=e.target.value;render();});
document.getElementById("filter-region").addEventListener("change",e=>{filterReg=e.target.value;render();});
document.getElementById("filter-status").addEventListener("change",e=>{filterSt=e.target.value;render();});

document.getElementById("btn-reset").addEventListener("click",()=>{
  if(!confirm("Nollataan kaikkien 154 ryhmän tilat → Odottaa?")) return;
  GROUPS.forEach(g=>{statuses[g.id]="ODOTTAA";});
  saveStatuses();render();
});

loadStorage();
</script>
